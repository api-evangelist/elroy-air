aid: elroy-air
name: Elroy Air
description: >-
  Elroy Air develops autonomous vertical takeoff and landing (VTOL) cargo
  aircraft for defense, commercial, and rapid-response logistics. Its flagship
  Chaparral is a hybrid-electric aircraft designed to carry up to 300 pounds of
  cargo across roughly 300 miles with no crew onboard, taking off and landing
  vertically and cruising autonomously between points. Founded in 2016 and based
  in San Francisco, the company works with partners including FedEx, NASA, the
  U.S. Air Force, and Lockheed Martin, and was selected for the U.S. Department
  of Transportation eVTOL Integration Pilot Program. Elroy Air is a hardware and
  autonomy company; it does not currently publish a public developer API,
  OpenAPI, SDKs, or MCP surface. This profile was added to the API Evangelist
  network as a portfolio lead and enriched with identity and domain-security
  data.
